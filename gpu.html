<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPU Details - GPU Finder</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="app">


    <!-- USE YOUR SAME SIDEBAR HERE -->

    <aside class="sidebar">

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-icon">

                <svg
                    viewBox="0 0 60 53"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M17.2115 52.8962L20.7656 50.3033L19.5362 48.6181L20.7212 47.7536L23.1805 51.1247L37.9919 40.3192L35.5325 36.9481L59.2295 19.6601L44.8866 0L5.19331 28.958L3.55412 26.7112L0 29.3041L17.2115 52.8962Z"
                        fill="#04375C"
                    />
                </svg>

            </div>


            <div class="logo-text">

                <h1>
                    GPU Finder
                </h1>

                <p>
                    Find Your Next Upgrade
                </p>

            </div>

        </a>


        <nav class="sidebar-nav">

            <a href="index.html" class="nav-link">
                <span class="nav-icon">⌂</span>
                Home
            </a>

            <a href="browse.html" class="nav-link">
                <span class="nav-icon">◉</span>
                Browse GPUs
            </a>

            <a href="compare.html" class="nav-link">
                <span class="nav-icon">⇄</span>
                Compare
            </a>

            <a href="analytics.html" class="nav-link">
                <span class="nav-icon">⌁</span>
                Analytics
            </a>

            <a href="rankings.html" class="nav-link">
                <span class="nav-icon">♜</span>
                Rankings
            </a>

        </nav>


        <div class="sidebar-promo">

            <div>

                <h3>
                    Better GPUs.<br>
                    Brighter Builds.
                </h3>

                <p>
                    Smarter choices for a faster tomorrow.
                </p>

            </div>

            <a
                href="browse.html"
                class="promo-button"
            >
                Explore GPUs →
            </a>

        </div>

    </aside>



    <main class="main gpu-page">


        <!-- GLOBAL SEARCH -->

        <header class="topbar">

            <form
                class="search-wrapper"
                id="homeSearchForm"
            >

                <span class="search-icon">
                    ⌕
                </span>


                <input
                    id="searchInput"
                    type="text"
                    placeholder='Search GPUs, e.g. "RTX 4090", "RX 7800 XT"...'
                    autocomplete="off"
                >


                <button
                    class="search-button"
                    type="submit"
                >
                    Search
                </button>

            </form>

        </header>



        <!-- GPU CONTENT -->

        <section
            id="gpuPageContent"
            class="gpu-page-content"
        >

            <div class="panel-loading">
                Loading GPU...
            </div>

        </section>


    </main>

</div>


<script src="js/script.js"></script>

</body>

</html>
