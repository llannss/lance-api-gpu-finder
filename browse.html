<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Browse GPUs - GPU Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">

    <!-- LOGO -->
    <a href="index.html" class="logo">

        <div class="logo-icon">
            <svg
                viewBox="0 0 60 53"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M17.2115 52.8962L20.7656 50.3033L19.5362 48.6181L20.7212 47.7536L23.1805 51.1247L37.9919 40.3192L35.5325 36.9481L59.2295 19.6601L44.8866 0L5.19331 28.958L3.55412 26.7112L0 29.3041L17.2115 52.8962Z"
                    fill="#04375C"
                />
            </svg>
        </div>

        <div class="logo-text">
            <h1>GPU Finder</h1>
            <p>Find Your Next Upgrade</p>
        </div>

    </a>


    <!-- NAVIGATION -->
    <nav class="sidebar-nav">

        <a href="index.html" class="nav-link">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a href="browse.html" class="nav-link active">
            <span class="nav-icon">◉</span>
            <span>Browse GPUs</span>
        </a>

        <a href="compare.html" class="nav-link">
            <span class="nav-icon">⇄</span>
            <span>Compare</span>
        </a>

        <a href="analytics.html" class="nav-link">
            <span class="nav-icon">⌁</span>
            <span>Analytics</span>
        </a>

        <a href="rankings.html" class="nav-link">
            <span class="nav-icon">♜</span>
            <span>Rankings</span>
        </a>

    </nav>

</aside>


    <!-- MAIN -->
    <main class="main" id="browsePage">

        <header class="topbar">
            <form
    class="search-wrapper"
    id="homeSearchForm"
>
    <span class="search-icon">
        ⌕
    </span>

    <input
        id="searchInput"
        type="text"
        placeholder='Search GPUs, e.g. "RTX 4090", "RX 7800 XT"...'
        autocomplete="off"
    >

    <button
        class="search-button"
        type="submit"
    >
        Search
    </button>
</form>
        </header>


        <section class="browse-header">
            <div>
                <h2>Browse GPUs</h2>
                <p>
                    Search, filter, sort, and inspect graphics cards from
                    NVIDIA, AMD, and Intel.
                </p>
            </div>

            <div class="browse-controls">
                <span id="resultsCount">0 GPUs</span>

                <select id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="vram-high">VRAM: High to Low</option>
                    <option value="name-az">Name: A to Z</option>
                </select>
            </div>
        </section>


        <section class="browse-layout" id="browseLayout">

            <!-- LEFT SIDE -->
            <div class="browse-catalog">
                <div class="gpu-grid browse-gpu-grid" id="browseGpuGrid"></div>
            </div>

            <!-- RIGHT SIDE DETAILS -->
            <aside class="details-sidebar" id="detailsSidebar">
                <div class="details-sidebar-inner">

                    <div class="details-sidebar-empty" id="detailsEmpty">
                        <h3>Select a GPU</h3>
                        <p>
                            Click <strong>View Details</strong> on any GPU card
                            to open the details panel here.
                        </p>
                    </div>

                    <div class="details-sidebar-content" id="detailsContent" hidden>
                        <div class="details-sidebar-top">
                            <h3>GPU Details</h3>

                            <button
                                type="button"
                                class="details-close"
                                id="detailsClose"
                            >
                                ×
                            </button>
                        </div>

                        <div id="detailsBody"></div>
                    </div>

                </div>
            </aside>

        </section>

    </main>

</div>

<script src="js/browse.js"></script>
<script src="js/script.js"></script>
</body>
</html>
