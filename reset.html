<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset password - GPU Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-page="reset">
    <main class="auth-card">
        <a class="logo" href="index.html" aria-label="GPU Finder home">
            <span class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 60 53" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.2115 52.8962L20.7656 50.3033L19.5362 48.6181L20.7212 47.7536L23.1805 51.1247L37.9919 40.3192L35.5325 36.9481L59.2295 19.6601L44.8866 0L5.19331 28.958L3.55412 26.7112L0 29.3041L17.2115 52.8962Z" fill="#04375C"/>
                </svg>
            </span>
            <span>
                <strong>GPU Finder</strong>
                <small>Find Your Next Upgrade</small>
            </span>
        </a>

        <h1 id="resetTitle">Reset your password</h1>
        <p class="auth-lead" id="resetLead">Enter your email and we'll send you a link to choose a new password.</p>

        <p class="auth-message" id="authMessage" role="status" aria-live="polite" hidden></p>

        <form class="auth-form" id="forgotForm" novalidate>
            <div class="auth-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
            </div>

            <button class="primary-btn auth-submit" type="submit">Send reset link</button>
        </form>

        <form class="auth-form" id="resetForm" novalidate hidden>
            <div class="auth-field">
                <label for="password">New password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="passwordHint">
                <span class="auth-hint" id="passwordHint">At least 8 characters. This signs you out on every device.</span>
            </div>

            <div class="auth-field">
                <label for="confirm">Confirm new password</label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
            </div>

            <button class="primary-btn auth-submit" type="submit">Change password</button>
        </form>

        <p class="auth-switch">Remembered it? <a href="signin.html">Sign in</a></p>
    </main>
<script src="js/auth.js"></script>
</body>
</html>
