<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset password – GPU Nexus</title>
    <meta name="theme-color" content="#f7f7fc">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/nexus-auth.css">
</head>
<body class="nx-page" data-page="reset">
    <div class="nx-backdrop" aria-hidden="true">
        <svg class="nx-gpu-art" viewBox="0 0 600 300" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs>
                <path id="nxBlade" d="M0 -20C22 -38 44 -52 64 -46"/>
            </defs>
            <rect x="20" y="40" width="20" height="220" rx="3"/>
            <rect x="25" y="70" width="10" height="34" rx="2"/>
            <rect x="25" y="116" width="10" height="34" rx="2"/>
            <rect x="25" y="162" width="10" height="24" rx="2"/>
            <rect x="40" y="52" width="520" height="190" rx="18"/>
            <path d="M300 70v154"/>
            <rect x="490" y="30" width="40" height="22" rx="3"/>
            <path d="M150 242v22h270v-22"/>
            <path d="M162 264v-12M174 264v-12M186 264v-12M198 264v-12M210 264v-12M222 264v-12M234 264v-12M246 264v-12M258 264v-12M270 264v-12M282 264v-12M294 264v-12M306 264v-12M318 264v-12M330 264v-12M342 264v-12M354 264v-12M366 264v-12M378 264v-12M390 264v-12M402 264v-12M414 264v-12"/>
            <g transform="translate(190 147)">
                <circle r="78"/>
                <circle r="20"/>
                <use href="#nxBlade" transform="rotate(0)"/>
                <use href="#nxBlade" transform="rotate(45)"/>
                <use href="#nxBlade" transform="rotate(90)"/>
                <use href="#nxBlade" transform="rotate(135)"/>
                <use href="#nxBlade" transform="rotate(180)"/>
                <use href="#nxBlade" transform="rotate(225)"/>
                <use href="#nxBlade" transform="rotate(270)"/>
                <use href="#nxBlade" transform="rotate(315)"/>
            </g>
            <g transform="translate(410 147)">
                <circle r="78"/>
                <circle r="20"/>
                <use href="#nxBlade" transform="rotate(0)"/>
                <use href="#nxBlade" transform="rotate(45)"/>
                <use href="#nxBlade" transform="rotate(90)"/>
                <use href="#nxBlade" transform="rotate(135)"/>
                <use href="#nxBlade" transform="rotate(180)"/>
                <use href="#nxBlade" transform="rotate(225)"/>
                <use href="#nxBlade" transform="rotate(270)"/>
                <use href="#nxBlade" transform="rotate(315)"/>
            </g>
        </svg>
    </div>

    <header class="nx-header">
        <a class="nx-brand" href="index.html" aria-label="GPU Nexus home">
            <svg class="nx-chip" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <path d="M11 2.5v4M16 2.5v4M21 2.5v4M11 25.5v4M16 25.5v4M21 25.5v4M2.5 11h4M2.5 16h4M2.5 21h4M25.5 11h4M25.5 16h4M25.5 21h4" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
                <rect x="6.5" y="6.5" width="19" height="19" rx="4.5" fill="#f5f3ff" stroke="#1e1b4b" stroke-width="2"/>
                <circle cx="16" cy="16" r="6" fill="#8b5cf6"/>
                <path d="M16 16c0-2.4 1.1-3.9 3-4.3M16 16c2.1 1.2 2.8 3 2.1 4.8M16 16c-2.1 1.2-4 1.2-5.2-.3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="16" cy="16" r="1.3" fill="#fff"/>
            </svg>
            <span class="nx-wordmark">GPU <span>Nexus</span></span>
        </a>

        <nav class="nx-nav" aria-label="Products">
            <a href="index.html">Finder</a>
            <!-- the game's own deploy for now; switch to /arena/ once the Hub rewrite exists -->
            <a href="https://lance-api-gpu-guessr.vercel.app">Guesser</a>
            <span class="nx-nav-item">Marketplace</span>
        </nav>
    </header>

    <main class="nx-layout is-focused">
        <div class="nx-card">
            <div class="nx-card-head">
                <div class="nx-badge" aria-hidden="true">
                    <svg data-for="default" viewBox="0 0 24 24" fill="none">
                        <circle cx="8" cy="15.5" r="4.5" stroke="currentColor" stroke-width="2"/>
                        <path d="M11.3 12.2L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg data-for="sent" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2"/>
                        <path d="M3.8 7.2l8.2 6 8.2-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 id="resetTitle">Forgot your password?</h1>
            </div>

            <p class="nx-card-lead" id="resetLead">Enter the email you signed up with and we'll send you a link to choose a new one.</p>

            <p class="auth-message" id="authMessage" role="status" aria-live="polite" hidden></p>

            <form class="nx-form" id="forgotForm" novalidate>
                <div class="nx-field">
                    <label for="email">Email</label>
                    <div class="nx-input">
                        <svg class="nx-input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M3.8 7.2l8.2 6 8.2-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input id="email" name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="you@example.com" required maxlength="254">
                    </div>
                </div>

                <button class="nx-submit" type="submit">Send reset link</button>
            </form>

            <form class="nx-form" id="resetForm" novalidate hidden>
                <div class="nx-field">
                    <label for="password">New password</label>
                    <div class="nx-input">
                        <svg class="nx-input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <input id="password" name="password" type="password" autocomplete="new-password" enterkeyhint="next" placeholder="Create a new password" required minlength="8" maxlength="128" aria-describedby="passwordRule signOutNote capsHint" data-rule="passwordRule" data-caps="capsHint">
                        <button class="nx-reveal" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">
                            <svg class="nx-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                            <svg class="nx-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <p class="nx-rule" id="passwordRule" data-met="false">
                        <svg class="nx-rule-icon" viewBox="0 0 16 16" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5" fill="none" stroke="#c4c6d8" stroke-width="1.5"/>
                            <path d="M5.2 8.2l1.9 1.9 3.7-3.9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        At least 8 characters
                        <span class="visually-hidden" aria-live="polite" data-rule-status></span>
                    </p>
                    <p class="nx-caps" id="capsHint" hidden>Caps Lock is on.</p>
                </div>

                <div class="nx-field">
                    <label for="confirm">Confirm new password</label>
                    <div class="nx-input">
                        <svg class="nx-input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" enterkeyhint="go" placeholder="Type it again" required minlength="8" maxlength="128" aria-describedby="confirmStatus" data-match="password" data-match-status="confirmStatus">
                        <button class="nx-reveal" type="button" aria-controls="confirm" aria-label="Show password" aria-pressed="false">
                            <svg class="nx-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                            <svg class="nx-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    <p class="nx-match" id="confirmStatus" aria-live="polite" hidden>
                        <svg class="nx-match-icon is-ok" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M5.2 8.2l1.9 1.9 3.7-3.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <svg class="nx-match-icon is-bad" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <span></span>
                    </p>
                </div>

                <p class="nx-note" id="signOutNote">Changing your password signs you out on every device.</p>

                <button class="nx-submit" type="submit">Change password</button>
            </form>

            <p class="nx-switch is-back">
                <a class="nx-back" href="signin.html">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back to sign in
                </a>
            </p>
        </div>
    </main>
<script src="js/auth.js"></script>
<script src="js/nexus-auth-ui.js"></script>
</body>
</html>
